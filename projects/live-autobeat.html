<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live monitoring board of AutoBeat</title>
<meta name="description" content="AutoBeat: live results of LLM agents improving methods on retrieval and graph benchmarks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/diff.min.js"></script>
<style>
/* Forked from the SCiEL live results page (rsi/site_template/index.html); same tokens and components. */
:root {
  color-scheme: light;
  --paper: #f9f9f6;
  --card: #ffffff;
  --ink: #1a1a1a;
  --muted: #55554f;
  --faint: #8a8a84;
  --rule: rgba(0,0,0,0.07);
  --rule-strong: rgba(0,0,0,0.18);
  --blue: #2a78d6;
  --blue-wash: rgba(42,120,214,0.10);
  --orange: #eb6834;
  --orange-wash: rgba(235,104,52,0.10);
  --good: #1f7a4d;
  --good-wash: rgba(31,122,77,0.10);
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --serif: "Charter", "Bitstream Charter", "Iowan Old Style", "Merriweather", Georgia, Cambria, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
button { font: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.topbar { border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--paper); }
.topbar .wrap { padding-inline: max(20px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 52px; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); position: relative; flex: none; }
.pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--good); opacity: 0; animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
.pulse.idle { background: var(--faint); } .pulse.idle::after { display: none; }
@keyframes ping { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }
header.hero { padding-block: 40px 4px; }
h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(32px, 4.6vw, 46px); line-height: 1.1; letter-spacing: -0.015em; margin: 0 0 8px; }
.author { font-family: var(--serif); font-size: 17px; color: var(--muted); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-block: 24px 16px; }
.stat { background: var(--card); padding: 14px 16px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
@media (max-width: 980px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat .v { font-size: 22px; } }
.board { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; margin-block: 16px 48px; }
.board.detail { padding: 18px 20px 22px; }

/* task panels */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.panel { background: #fcfcfa; border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 11px; cursor: pointer;
  color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; min-width: 0; }
.panel:hover { border-color: var(--rule-strong); box-shadow: 0 6px 22px rgba(0,0,0,0.06); transform: translateY(-1px); }
.panel:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.ptop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.pname { font-weight: 600; font-size: 15.5px; line-height: 1.3; overflow-wrap: anywhere; }
.pfam { font-size: 12px; color: var(--faint); margin-top: 2px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex: none; }
.status.running { color: var(--blue); background: var(--blue-wash); }
.status.finished { color: var(--muted); background: rgba(0,0,0,0.045); }
.status.idle { color: var(--faint); background: transparent; border: 1px dashed var(--rule-strong); padding-block: 2px; }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
.chip { display: inline-flex; max-width: 100%; font-size: 11.5px; line-height: 1.3; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule-strong);
  background: var(--card); color: var(--muted); cursor: pointer; min-width: 0; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.pprog { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(0,0,0,0.06); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.bar.done i { background: var(--ink); opacity: .5; }
.pmeta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.pmeta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.vals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border-radius: 8px; overflow: hidden; border: 1px solid var(--rule); }
.vals > div { background: var(--card); padding: 7px 9px; min-width: 0; }
.vals .k { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vals .v { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vals .s { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vals .ours .v { font-weight: 700; }
.pfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pfoot .l { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.tag { font-size: 11px; font-weight: 600; color: var(--orange); background: var(--orange-wash); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.badge.beat { color: var(--good); background: var(--good-wash); }
.badge.match { color: var(--blue); background: var(--blue-wash); }
.badge.gap { color: var(--muted); background: rgba(0,0,0,0.045); font-weight: 500; }
.badge.na { color: var(--faint); font-weight: 500; padding-inline: 0; }
.note { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--rule-strong);
  font: 600 11px/1 var(--serif); font-style: italic; color: var(--muted); cursor: help; flex: none; }
.open { font-size: 12px; color: var(--faint); white-space: nowrap; }
.panel:hover .open { color: var(--blue); }
svg.spark { display: block; width: 100%; height: 36px; overflow: visible; }

/* detail view */
.back { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.dhead h2 { font-family: var(--serif); font-size: clamp(24px, 3.4vw, 34px); margin: 0 0 6px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.dsub { color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--rule-strong); margin-top: 18px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; font-size: 13px; padding: 7px 14px 6px; border: 1px solid var(--rule-strong); border-bottom: 0; border-radius: 8px 8px 0 0;
  background: #f1f1ec; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 600; padding-bottom: 7px; }
.kpis { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-block: 16px 14px; }
.kpi { background: var(--card); padding: 11px 13px; min-width: 0; }
.kpi .k { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.kpi .v.mono { font-family: var(--mono); font-size: 15px; padding-top: 2px; }
.kpi .s { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.box { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.box h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .07em; }
.prose { font-family: var(--serif); font-size: 15px; line-height: 1.65; overflow-wrap: anywhere; }
.prose p { margin: 0 0 10px; }
.prose h4 { font-family: var(--sans); font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
.prose h4:first-child { margin-top: 0; }
.prose ul, .prose ol { margin: 0 0 10px; padding-left: 22px; } .prose li { margin-bottom: 5px; }
.prose code { font-family: var(--mono); font-size: 12.5px; background: rgba(0,0,0,0.05); padding: 1px 4px; border-radius: 4px; }
.prose pre { font-family: var(--mono); font-size: 12.5px; background: #fafaf7; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.prose.clip { max-height: 420px; overflow: auto; }
dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 16px; row-gap: 5px; font-size: 13.5px; margin: 0; }
dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; min-width: 0; }
.opmix { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 14px 0 8px; }
.opmix i { display: block; height: 100%; }
.callout { font-size: 13px; color: var(--muted); background: #fbf8f2; border: 1px solid rgba(235,104,52,0.25); border-radius: 8px; padding: 9px 12px; margin-top: 12px; overflow-wrap: anywhere; }

/* chart */
.charthead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .sw { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.legend .ln { width: 16px; height: 2px; background: var(--ink); display: inline-block; }
.legend .x { color: #a3a39c; font-weight: 700; font-style: normal; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 4px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chartwrap { position: relative; width: 100%; }
svg.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
svg.chart text { font-family: var(--sans); }
.hint { font-size: 12px; color: var(--faint); margin-top: 6px; }
.tip { position: fixed; pointer-events: none; z-index: 30; background: var(--ink); color: #fff; font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 7px;
  white-space: nowrap; font-variant-numeric: tabular-nums; transform: translate(-50%, calc(-100% - 12px)); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.tip b { font-family: var(--mono); font-weight: 600; }
.tip .op { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

/* inspector */
.inspector { border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 18px; }
/* in-page jumps land below the sticky top bar (52px) */
html { scroll-padding-top: 64px; }
.inspector, .chartwrap, .box, .codebox, table.list tr { scroll-margin-top: 64px; }
.ihead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.ihead .t { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.ihead .s { font-size: 13px; color: var(--muted); }
.navbtns { display: flex; gap: 6px; }
.navbtns button { border: 1px solid var(--rule-strong); background: var(--card); border-radius: 7px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
.navbtns button:disabled { opacity: .4; cursor: default; }
.icols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 860px) { .icols { grid-template-columns: 1fr; } }
.icard { background: #fcfcfa; border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.icard h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .07em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.icard h4 .pill { text-transform: none; letter-spacing: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,0.05); color: var(--ink); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.step { display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
.step .row { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; }
.step .row .k { color: var(--muted); }
.step .row > span { overflow-wrap: anywhere; min-width: 0; }
.quote { font-family: var(--serif); font-size: 14.5px; line-height: 1.6; border-left: 3px solid var(--rule-strong); padding-left: 12px; margin: 0; overflow-wrap: anywhere; }
.codebox { margin-top: 14px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: #fff; }
.codehead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); background: #fafaf7; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.codehead button { border: 0; background: none; color: var(--blue); cursor: pointer; padding: 0; font-size: 12.5px; }
pre.code { margin: 0; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; overflow: auto; max-height: 560px; background: #fff; }
pre.code code.hljs { padding: 0; background: transparent; }
pre.code.collapsed { max-height: 300px; }

.tablebox { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
table.list th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
table.list td { padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: top; }
table.list td.wrap { white-space: normal; min-width: 180px; overflow-wrap: anywhere; }
table.list tr.sel td { background: var(--blue-wash); }
table.list tbody tr[data-v] { cursor: pointer; } table.list tbody tr[data-v]:hover td { background: #f6f6f2; }
.empty { color: var(--faint); padding: 28px; text-align: center; }
.loading { color: var(--faint); padding: 40px 0; }
.mt { margin-top: 14px; }
/* narrow screens: these come last so they win */
@media (max-width: 520px) {
  header.hero { padding-block: 32px 0; }
  .board { padding: 10px; border-radius: 12px; }
  .board.detail { padding: 14px 12px 16px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 14px 14px 12px; }
  .box { padding: 14px; }
  .step .row { grid-template-columns: 88px minmax(0, 1fr); }
  table.list .hide-s { display: none; }
}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <span></span>
  <span class="live"><span class="pulse" id="pulse"></span><span id="liveText">Loading…</span></span>
</div></div>
<header class="hero wrap"><h1>Live monitoring board of AutoBeat</h1><p class="author">Yusheng Zhao</p></header>
<main class="wrap" id="app"><div class="loading">Loading…</div></main>
<div class="tip" id="tip" hidden></div>

<script>
(function () {
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const BASE = "live-autobeat/";
  // version status -> [label, colour]; fixed, validated categorical slots 1 and 2 plus neutral
  const STS = { kept: ["kept", "#2a78d6"], reverted: ["reverted", "#eb6834"], unknown: ["not stated", "#8a8a84"] };
  const stKey = s => STS[s] ? s : "unknown";
  // anchors: [key, label, dash, colour]
  const ANCHORS = [
    ["baseline_self", "baseline", "2 3", "#a3a39c"],
    ["sota_self", "sota (self)", "6 4", "#6b6b65"],
    ["sota_reported", "literature", "4 4", "#1a1a1a"],
  ];

  let DATA = null, ROUTE = { view: "grid" }, ZOOM = "focus", CH = null, MODEL = null;
  const PSEL = {}, RUNCACHE = {}, TASKCACHE = {}, CODECACHE = {};

  /* ---------- formatting ---------- */
  function fmt(x, sig) {
    if (x == null || !isFinite(x)) return "—";
    if (Number.isInteger(x) && Math.abs(x) < 1e7) return String(x);
    const a = Math.abs(x);
    if (a !== 0 && (a < 1e-3 || a >= 1e7)) return x.toExponential(Math.max(1, (sig || 4) - 1));
    return String(Number(x.toPrecision(sig || 4)));
  }
  const pct = g => { const p = g * 100; return p >= 1 ? p.toFixed(1) + "%" : p >= 0.01 ? p.toFixed(2) + "%" : p.toPrecision(2) + "%"; };
  function dur(sec) {
    if (sec == null) return "—";
    const h = sec / 3600;
    if (h < 1) return Math.max(1, Math.round(sec / 60)) + " min";
    if (h < 48) return (h < 10 ? h.toFixed(1) : Math.round(h)) + " h";
    return (h / 24).toFixed(1) + " days";
  }
  const when = iso => iso ? iso.slice(0, 16).replace("T", " ") + " UTC" : "—";
  const n = x => x == null ? "—" : Number(x).toLocaleString("en-US");
  const better = t => t.direction === "min" ? "lower is better" : "higher is better";
  const sign = t => t.direction === "min" ? -1 : 1;
  function badge(t, c) {
    const pub = t.anchors.sota_reported;
    if (pub == null) return '<span class="badge na">no literature value</span>';
    if (!c) return '<span class="badge na">no result yet</span>';
    if (c.gap == null) return '<span class="badge na">no score yet</span>';
    const vis = c.best_kind === "visible" ? " (visible)" : "";
    if (c.gap < -1e-9) return '<span class="badge beat">▲ beats literature by ' + pct(-c.gap) + vis + '</span>';
    if (c.gap <= 1e-6) return '<span class="badge match">● on par with literature' + vis + '</span>';
    return '<span class="badge gap">' + pct(c.gap) + ' behind literature' + vis + '</span>';
  }
  const noteIcon = t => t.note ? '<span class="note" title="' + esc(t.note) + '" aria-label="note: ' + esc(t.note) + '">i</span>' : '';
  function md(src) {
    const lines = esc(src).split("\n"); let out = "", list = null, para = [], fence = null;
    const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

    const step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || 10 * mag;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(Number(v.toPrecision(12)));
    return out;
  }
  /* chart: x = version, y = metric (better is up); markers coloured by kept/reverted, best-so-far step line */
  function drawChart() {
    const { t, card, run } = CH, a = t.anchors, wrap = $("#chartwrap");
    const W = Math.max(300, Math.round(wrap.clientWidth || 900)), small = W < 560, H = small ? 300 : 360;
    const pad = { l: small ? 50 : 70, r: small ? 40 : 56, t: 16, b: 58 };
    const rows = run.rows, ok = rows.filter(r => r.val != null), sg = sign(t);
    const xmax = Math.max(1, ...rows.map(r => r.v));
    const vals = ok.map(r => r.val).concat(card.final != null ? [card.final] : []);
    const refs = ANCHORS.map(x => a[x[0]]).filter(v => v != null);
    let lo, hi;
    if (!vals.length) { const all = refs.length ? refs : [0, 1]; lo = Math.min(...all); hi = Math.max(...all); }
    else if (ZOOM === "full") { const all = vals.concat(refs); lo = Math.min(...all); hi = Math.max(...all); }
    else {
      // "best region": the better three quarters of versions, plus the sealed score and the sota anchors
      const good = vals.map(v => v * sg).sort((x, y) => x - y);
      const cut = good[Math.floor((good.length - 1) * 0.25)];
      const tops = [good[good.length - 1]].concat(["sota_self", "sota_reported"].filter(k => a[k] != null).map(k => a[k] * sg));
      const top = Math.max(...tops), bot = Math.min(cut, ...tops);
      const span = (top - bot) || Math.abs(top) * 1e-3 || 1;
      const p = bot - span * 0.06, q = top + span * 0.1;
      lo = sg > 0 ? p : -q; hi = sg > 0 ? q : -p;
    }
    if (hi === lo) { hi += Math.abs(hi) * 0.05 || 1; lo -= Math.abs(lo) * 0.05 || 1; }
    const plotB = H - pad.b, failY = H - 12, testX = W - pad.r / 2, xr = W - pad.l - pad.r - 16;
    const X = v => pad.l + 6 + (v / xmax) * xr;
    const Yraw = v => pad.t + (sg > 0 ? (hi - v) : (v - lo)) / (hi - lo) * (plotB - pad.t);
    const Y = v => Math.max(pad.t, Math.min(plotB, Yraw(v)));
    let g = "";
    niceTicks(lo, hi, 5).forEach(tv => {
      const y = Yraw(tv); if (y < pad.t - 1 || y > plotB + 1) return;
      g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="rgba(0,0,0,0.06)"/>';
      g += '<text x="' + (pad.l - 8) + '" y="' + (y + 4) + '" font-size="11" fill="#8a8a84" text-anchor="end">' + esc(fmt(tv, 6)) + '</text>';
    });
    niceTicks(0, xmax, small ? 4 : 8).forEach(tv => {
      if (tv >= 0 && tv <= xmax && Number.isInteger(tv)) g += '<text x="' + X(tv) + '" y="' + (plotB + 16) + '" font-size="11" fill="#8a8a84" text-anchor="middle">' + tv + '</text>';
    });
    g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + plotB + '" y2="' + plotB + '" stroke="rgba(0,0,0,0.18)"/>';
    g += '<line x1="' + (W - pad.r) + '" x2="' + (W - pad.r) + '" y1="' + pad.t + '" y2="' + plotB + '" stroke="rgba(0,0,0,0.08)"/>';
    g += '<text x="' + (pad.l + 6 + xr / 2) + '" y="' + (plotB + 33) + '" font-size="11.5" fill="#55554f" text-anchor="middle">version</text>';
    g += '<text x="' + testX + '" y="' + (plotB + 16) + '" font-size="11" fill="#55554f" text-anchor="middle">test</text>';
    g += '<text x="' + (pad.l - 8) + '" y="' + (failY + 4) + '" font-size="10.5" fill="#8a8a84" text-anchor="end">no score</text>';
    ANCHORS.forEach(x => {
      const v = a[x[0]]; if (v == null) return; const y = Yraw(v);
      if (y < pad.t - 1 || y > plotB + 1) return;
      g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="' + x[3] + '" stroke-width="1.2" stroke-dasharray="' + x[2] + '"/>';
      g += '<text x="' + (W - pad.r - 4) + '" y="' + (y - 5) + '" font-size="11" fill="#55554f" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="3">' + x[1] + ' ' + esc(fmt(v, 6)) + '</text>';
    });
    let d = "", best = null;
    for (const r of ok) if (best == null || sg * r.val > sg * best) { d += best == null ? "M" + X(r.v).toFixed(1) + " " + Y(r.val).toFixed(1) : " H" + X(r.v).toFixed(1) + " V" + Y(r.val).toFixed(1); best = r.val; }
    if (d) d += " H" + X(xmax).toFixed(1);
    const pts = [];
    let marks = "";
    for (const r of rows) {
      const x = X(r.v), col = STS[stKey(r.st)][1];
      if (r.val != null) {
        const yv = Yraw(r.val), clipped = yv < pad.t || yv > plotB, y = Y(r.val);
        pts.push({ r, x, y });
        marks += clipped
          ? '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.5" fill="#fff" stroke="' + col + '" stroke-width="1.4"/>'
          : '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4.5" fill="' + col + '" stroke="#fff" stroke-width="1.5"/>';
      } else {
        pts.push({ r, x, y: failY });
        marks += '<path d="M' + (x - 3).toFixed(1) + ' ' + (failY - 3) + 'l6 6m0 -6l-6 6" stroke="#b5b5ae" stroke-width="1.4" stroke-linecap="round"/>';
      }
    }
    if (card.final != null) {
      const y = Y(card.final); pts.push({ r: null, x: testX, y });
      marks += '<path d="M' + testX + ' ' + (y - 7) + 'l7 7-7 7-7-7z" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/>';
    }
    g += '<path d="' + d + '" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + marks;
    g += '<g id="selmark"></g><line id="cross" x1="0" x2="0" y1="' + pad.t + '" y2="' + plotB + '" stroke="rgba(0,0,0,0.22)" visibility="hidden"/>';
    wrap.innerHTML = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t.metric) + ' of every version for ' + esc(t.name) + ', ' + esc(card.model) + '">' + g + '</svg>';
    CH.pts = pts; CH.W = W;
    markSelected(ROUTE.v != null ? ROUTE.v : card.best_visible_version);
    const svg = $("svg.chart", wrap), tip = $("#tip"), cross = $("#cross", wrap);
    const nearest = ev => {
      const box = svg.getBoundingClientRect(), s = W / box.width;
      const px = (ev.clientX - box.left) * s, py = (ev.clientY - box.top) * s;
      let bp = null, bd = Infinity;
      for (const p of pts) { const dd = (p.x - px) ** 2 + 0.35 * (p.y - py) ** 2; if (dd < bd) { bd = dd; bp = p; } }
      return bd < (28 * s) ** 2 ? { p: bp, box, s } : null;
    };
    let lastHit = null;  // hover and click share one hit test
    svg.addEventListener("pointermove", ev => {
      const hit = lastHit = nearest(ev);
      if (!hit) { tip.hidden = true; cross.setAttribute("visibility", "hidden"); svg.style.cursor = "default"; return; }
      const r = hit.p.r;
      if (!r) tip.innerHTML = 'sealed test <b>' + esc(fmt(card.final, 8)) + '</b><br>' + esc(card.model);
      else {
        const par = r.par != null ? run.byV[r.par] : null;
        const dl = r.val != null && par && par.val != null ? r.val - par.val : null;
        tip.innerHTML = 'version <b>' + r.v + '</b> · <span class="op" style="background:' + STS[stKey(r.st)][1] + '"></span>' + STS[stKey(r.st)][0] + '<br>' +
          (r.val != null ? 'value <b>' + esc(fmt(r.val, 8)) + '</b>' + (dl != null ? ' · ' + (dl >= 0 ? "+" : "") + esc(fmt(dl, 3)) + ' vs v' + r.par : '') : 'no score');
      }
      tip.style.left = Math.min(Math.max(hit.box.left + hit.p.x / hit.s, 110), window.innerWidth - 110) + "px"; tip.style.top = (hit.box.top + hit.p.y / hit.s) + "px"; tip.hidden = false;
      cross.setAttribute("x1", hit.p.x); cross.setAttribute("x2", hit.p.x); cross.setAttribute("visibility", "visible");
      svg.style.cursor = r ? "pointer" : "default";
    });
    svg.addEventListener("pointerleave", () => { lastHit = null; tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
    svg.addEventListener("click", ev => { const hit = lastHit || nearest(ev); if (hit && hit.p.r) select(hit.p.r.v); });
  }
  function markSelected(v) {
    const g = $("#selmark"); if (!g || !CH || !CH.pts) return;
    const p = CH.pts.find(q => q.r && q.r.v === v);
    g.innerHTML = p ? '<circle cx="' + p.x + '" cy="' + p.y + '" r="8.5" fill="none" stroke="#1a1a1a" stroke-width="2"/>' : "";
  }
  function select(v, fromHash) {
    if (!CH || !CH.card) return;
    if (!fromHash) history.replaceState(null, "", taskHash(CH.t.name, CH.card.model, v));
    ROUTE.v = v;
    markSelected(v);
    document.querySelectorAll("#imps tr[data-v]").forEach(tr => tr.classList.toggle("sel", +tr.dataset.v === v));
    renderInspector(v);
  }
  async function renderInspector(v) {
    const box = $("#inspector"); if (!box) return;
    const { t, card, run } = CH, rows = run.rows, i = rows.findIndex(r => r.v === v), r = rows[i];
    if (!r) { box.innerHTML = '<p class="hint" style="margin:0">Click a marker to inspect that version.</p>'; return; }
    const par = r.par != null ? run.byV[r.par] : null;
    const parentTxt = r.par == null ? "—" : par
      ? '<a href="' + taskHash(t.name, card.model, par.v) + '">version ' + par.v + '</a> <span style="color:var(--faint)">' + (par.val != null ? "value " + esc(fmt(par.val, 8)) : "no score") + '</span>'
      : 'v' + r.par + ' <span style="color:var(--faint)">(not in the log)</span>';
    let delta = "";
    if (r.val != null && par && par.val != null) {
      const dlt = r.val - par.val, up = sign(t) * dlt > 0;
      delta = ' <span style="color:' + (up ? "var(--good)" : "var(--muted)") + '">' + (dlt >= 0 ? "+" : "") + esc(fmt(dlt, 4)) + ' vs parent</span>';
    }
    const st = STS[stKey(r.st)];
    box.innerHTML =
      '<div class="ihead"><div><div class="t">Version <span class="num">' + r.v + '</span>' + (card.best_visible_version === r.v ? ' <span class="badge beat" style="vertical-align:3px">best visible</span>' : '') + '</div>' +
      '<div class="s">' + esc(card.model) + ' · ' + esc(card.run_id) + '</div></div>' +
      '<div class="navbtns"><button data-nav="-1"' + (i <= 0 ? " disabled" : "") + '>← Previous</button><button data-nav="1"' + (i >= rows.length - 1 ? " disabled" : "") + '>Next →</button></div></div>' +
      '<div class="icols">' +
      '<div class="icard"><h4>Version <span class="pill"><i style="background:' + st[1] + '"></i>' + st[0] + '</span></h4><div class="step">' +
      '<div class="row"><span class="k">Parent</span><span>' + parentTxt + '</span></div>' +
      '<div class="row"><span class="k">Score</span><span>' + (r.val != null ? '<b class="num">' + esc(fmt(r.val, 10)) + '</b>' + delta : '<span style="color:#9a3412">no score</span>') + '</span></div>' +
      (r.sc ? '<div class="row"><span class="k">As logged</span><span class="num" style="font-size:12.5px">' + esc(r.sc) + '</span></div>' : '') +
      '<div class="row"><span class="k">Decision</span><span>' + st[0] + '</span></div>' +
      '<div class="row"><span class="k">Model</span><span>' + esc(card.model) + '</span></div>' +
      '</div></div>' +
      '<div class="icard"><h4>What changed</h4>' + (r.chg ? '<p class="quote">' + esc(r.chg) + '</p>' : '<p style="color:var(--faint);font-size:13px;margin:0">The log gives no description for this version.</p>') +
      '<p style="font-size:12px;color:var(--faint);margin:10px 0 0">From the agent\'s experiment log, written by the model.</p></div></div>' +
      (r.diff ? '<div class="codebox"><div class="codehead"><span>Diff against version ' + r.par + '</span></div><pre class="code collapsed"><code class="language-diff" id="diffview">' + esc(r.diff) + '</code></pre></div>' : '') +
      (r.code ? '<div class="codebox"><div class="codehead"><span>Program of version ' + r.v + ' (solve.py)</span><span style="display:flex;gap:14px"><button id="expand">Expand</button><a href="' + BASE + 'code/' + r.code + '.py" target="_blank" rel="noopener">Raw file</a></span></div><pre class="code collapsed"><code class="language-python" id="codeview">Loading…</code></pre></div>'
        : '<p class="hint">No code snapshot for this version.</p>');
    box.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => { const j = i + +b.dataset.nav; if (rows[j]) select(rows[j].v); }));
    const dv = $("#diffview");
    if (dv && window.hljs) hljs.highlightElement(dv);
    if (r.code) {
      const text = await code(r.code);
      const el = $("#codeview");
      if (!el || ROUTE.v != null && ROUTE.v !== v) return;
      el.textContent = text;
      if (window.hljs) hljs.highlightElement(el);
      const ex = $("#expand");
      ex.addEventListener("click", () => { const pre = el.parentElement; pre.classList.toggle("collapsed"); ex.textContent = pre.classList.contains("collapsed") ? "Expand" : "Collapse"; });
    }
  }

  /* ---------- live indicator (top right) ---------- */
  function ago(iso) {
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 90) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 172800) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " days ago";
  }
  function renderTopbar() {
    const running = DATA.summary ? DATA.summary.running : 0;
    $("#pulse").className = "pulse" + (running ? "" : " idle");
    $("#liveText").textContent = (running ? running + " running" : "idle") + " · updated " + ago(DATA.generated_at);
    $("#liveText").title = "Data generated " + new Date(DATA.generated_at).toUTCString().replace(" GMT", " UTC");
  }

  /* ---------- events & live refresh ---------- */
  document.addEventListener("click", ev => {
    const z = ev.target.closest("[data-zoom]");
    if (z && CH && CH.card) { ZOOM = z.dataset.zoom; document.querySelectorAll("[data-zoom]").forEach(b => b.setAttribute("aria-pressed", String(b === z))); drawChart(); return; }
    const tr = ev.target.closest("#imps tr[data-v]");
    if (tr && CH && CH.card) { select(+tr.dataset.v); $("#chartwrap").scrollIntoView({ behavior: "smooth", block: "center" }); }
  });
  let rz;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (CH && CH.card && ROUTE.view === "task" && $("#chartwrap")) drawChart(); }, 150); });

  async function refresh() {
    try {
      const d = await getJSON("data.json");
      if (DATA && d.generated_at === DATA.generated_at) return;
      DATA = d; renderTopbar();
      if (ROUTE.view === "task") { CH = null; renderTask(true); } else renderGrid();
    } catch (e) { $("#liveText").textContent = "could not refresh"; }
  }
  (async function init() {
    parseRoute();
    try { DATA = await getJSON("data.json"); } catch (e) { $("#app").innerHTML = '<div class="empty">Could not load results.</div>'; return; }
    renderTopbar();
    route();
    setInterval(refresh, 10 * 60 * 1000);  // the site is regenerated every 10 minutes
    setInterval(() => DATA && renderTopbar(), 30 * 1000);  // the relative time ticks without refetching (as on SCiEL)
  })();
})();
</script>
</body>
</html>
